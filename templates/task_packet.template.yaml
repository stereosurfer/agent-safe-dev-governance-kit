# Optional projection of one live GitHub issue. Every list item must already be
# authorized by the referenced issue. Use github_unavailable_fallback only when
# GitHub is verifiably unavailable and no escalation trigger applies; that mode
# is temporary authority only for bounded local work, must carry the full 13
# fields plus both execution gates, and must be replaced by an issue before PR
# creation or merge.
mode: "issue_refinement"
durable_source_of_truth: "GitHub issue #000"
allowed_paths:
  - "one/exact/authorized/path"
context_read_set:
  - "AGENTS.md"
  - "current GitHub issue"
project_specific_validation:
  - "one exact check already required by issue #000"
