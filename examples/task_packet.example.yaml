mode: "github_unavailable_fallback"
github_issue_status: "pending_unavailable"
lane: "validation_tooling"
intelligence_level: "frontier"
reason: "Fallback fixture requires contract and validator judgment."
durable_source_of_truth: "Repository task packet pending GitHub recovery."
objective: "Preserve one complete bounded work unit until an issue can be created."
plan:
  - "Retry GitHub issue creation before any PR."
checklist:
  - "[ ] All 13 fields and both execution gates are present."
acceptance_sheet:
  - "[ ] task-packet-check accepts the fallback shape."
allowed_paths:
  - "examples/task_packet.example.yaml"
context_read_set:
  - "AGENTS.md"
  - "docs/control/TASK_PACKET_FORMAT.md"
project_specific_validation:
  - "python3 scripts/asgk.py task-packet-check --file examples/task_packet.example.yaml"
expected_output: "A complete temporary local-work scope that cannot authorize a PR or merge."
non_goals:
  - "No external action, protected-path exception, PR creation, or merge under fallback authority."
stop_conditions:
  - "GitHub issue remains unavailable before PR creation, merge, or external action."
rollback_expectations: "Discard the fallback after transferring its full scope to GitHub."
