name: Bootstrap validation
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review
      - converted_to_draft
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'
      - name: ASGK doctor
        run: python3 scripts/asgk.py doctor
      - name: PR policy gate
        if: github.event_name == 'pull_request'
        run: python3 scripts/asgk.py policy-gate --github-event "$GITHUB_EVENT_PATH"
      - name: PR changed-path hygiene
        if: github.event_name == 'pull_request'
        run: python3 scripts/asgk.py hygiene --git-base "${{ github.event.pull_request.base.sha }}" --git-head HEAD
      - name: Positive blocked-draft PR body preflight
        run: python3 scripts/pr_governance_preflight.py check --body-file examples/pr_body.merge-blocked-draft.valid.md
